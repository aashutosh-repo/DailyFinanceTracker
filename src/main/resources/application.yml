#spring.application.name=customer
server:
  port: ${PORT:8080}

spring:
  application:
    name: Finance-Tracking
  profiles:
    active: prod

  datasource:
    url: jdbc:postgresql://${HOSTNAME}:${PORT}/${DB_NAME}?sslmode=require
    username: ${DB_USER}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
jwt:
  secret: "mySuperSecureSecretKeyForJwtTokenGeneration123!"
  expiration-ms: 86400000 # 1 day in milliseconds

ollama:
  url: http://localhost:11434
  model: phi3:mini
  timeout: 60
