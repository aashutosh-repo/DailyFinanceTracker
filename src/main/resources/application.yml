#spring.application.name=customer
server:
  port: ${PORT:8080}

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: Finance-Tracking
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
    show-sql: false
  ai:
    ollama:
      url: http://localhost:11434
      model-chat: qwen2.5-coder:7b
      model-embedding: nomic-embed-text
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: 1024
        index-type: hnsw
        distance-type: cosine_distance

payment:
  orders:
    demo-order-id: ${PAYMENT_DEMO_ORDER_ID:ORD-10001}
    demo-amount: ${PAYMENT_DEMO_AMOUNT:1768.82}
  providers:
    payu:
      enabled: ${PAYU_TEST_ENABLED:true}
      mode: test
      key: ${PAYU_TEST_KEY}
      salt: ${PAYU_TEST_SALT}
      base-url: ${PAYU_TEST_BASE_URL:https://test.payu.in/_payment}
      success-url: ${PAYU_TEST_SUCCESS_URL:http://localhost:8080/api/payments/providers/payu/callback}
      failure-url: ${PAYU_TEST_FAILURE_URL:http://localhost:8080/api/payments/providers/payu/callback}
      frontend-return-url: ${PAYU_TEST_FRONTEND_RETURN_URL:http://localhost:4200/v1/payments}

jwt:
  secret: "mySuperSecureSecretKeyForJwtTokenGeneration123!"
  expiration-ms: 86400000 # 1 day in milliseconds
logging:
  level:
    org.springframework.boot: INFO

